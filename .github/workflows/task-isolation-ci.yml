name: Temporary task isolation checks

on:
  push:
    branches:
      - fix/task-runtime-isolation

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flask requests loguru
      - name: Compile changed Python files
        run: |
          python -m py_compile \
            app.py \
            utils/task_runtime.py \
            utils/forum_reader.py \
            ForumEngine/task_store.py \
            ForumEngine/monitor.py \
            QueryEngine/agent.py \
            QueryEngine/nodes/summary_node.py \
            MediaEngine/agent.py \
            MediaEngine/nodes/summary_node.py \
            InsightEngine/agent.py \
            InsightEngine/nodes/summary_node.py \
            ReportEngine/agent.py \
            ReportEngine/flask_interface.py \
            SingleEngineApp/query_engine_streamlit_app.py \
            SingleEngineApp/media_engine_streamlit_app.py \
            SingleEngineApp/insight_engine_streamlit_app.py
      - name: Check browser bootstrap syntax
        run: node --check static/task_isolation.js
      - name: Run isolation regression tests
        run: |
          pytest -q \
            tests/test_task_runtime_isolation.py \
            tests/test_search_route.py \
            tests/test_report_cancel_route.py \
            tests/test_monitor.py
